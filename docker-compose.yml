services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dejavu
      POSTGRES_PASSWORD: dejavu
      POSTGRES_DB: dejavu
    ports: ['5432:5432']
    volumes: ['dejavu-db:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dejavu']
      interval: 5s
      retries: 10

volumes:
  dejavu-db:
